indent-width = 2
line-length = 120

[format]
quote-style = 'single'

[lint]
ignore = [
  'E501',    # don't check line length (mainly for comments)
  'D417',    # don't require documentation for every function parameter
  'PLR2004'  # most numbers are not magic
]
extend-select = [
  'A',
  'B',    # flake8-bugbear
  'D',    # pydocstyle
  'E',    # pycodestyle
  'EXE',
  'F',    # Pyflakes
  'FA',
  'FIX',
  'FLY',
  'I',    # isort
  'PERF', # performance
  'PLC',  # pylint conventions
  'PLE',  # pylint errors
  'PLR',  # pylint refactors
  'PLW',  # pylint warnings
  'S',    # flake8-bandit
  'SIM',  # flake8-simplify
  'UP',   # pyupgrade
  'W'     # pycodestyle
]

[lint.pydocstyle]
convention = 'google'

[lint.per-file-ignores]
"tests/**/*.py" = [
  "S101" # allow using assert in tests
]
